# Render Blueprint — free-tier backend (https://render.com)
# Connect repo → New Blueprint → select this file.
services:
  - type: web
    name: ai-business-assistant-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Optional: GEMINI_API_KEY, RAG_TOP_K, etc.
